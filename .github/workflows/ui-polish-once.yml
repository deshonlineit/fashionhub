name: FashionHub UI polish migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-polish-once.yml'

permissions:
  contents: write

jobs:
  patch-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add favicon and shared UI script to all pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').glob('*.html'):
              s = path.read_text(encoding='utf-8')
              if 'assets/images/favicon.svg' not in s:
                  marker = '<meta name="theme-color" content="#f43268">'
                  tag = '<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">'
                  if marker in s:
                      s = s.replace(marker, marker + tag, 1)
                  elif '</head>' in s:
                      s = s.replace('</head>', tag + '</head>', 1)
              if 'assets/js/category-hover.js' not in s:
                  s = s.replace('</body>', '<script src="assets/js/category-hover.js" defer></script></body>', 1)
              path.write_text(s, encoding='utf-8')
          PY
      - name: Commit migration and remove one-time workflow
        run: |
          rm -f .github/workflows/ui-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply favicon and shared UI behavior to all pages"
          git push
